<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMOS – Asistente de Azkaban Reads</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'VT323', 'Courier New', monospace;
      background: #000;
      color: #00FFFF;
      overflow-x: hidden;
      font-size: 18.5px;
      line-height: 1.65;
    }

    /* Botón flotante para abrir LUMOS */
    #lumos-trigger {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #000;
      border: 2px solid #00FFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.25s;
      z-index: 9999;
      color: #00FFFF;
      box-shadow: 0 0 8px rgba(0,255,255,0.3);
    }

    #lumos-trigger:hover {
      box-shadow: 0 0 15px rgba(0,255,255,0.6);
      transform: scale(1.05);
    }

    #lumos-trigger.active {
      transform: scale(0);
    }

    /* Contenedor del chat - DESKTOP BASE (≥1024px) */
    #lumos-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 400px;
      height: 62vh;
      max-height: 650px;
      background: #000;
      border: 2px solid #00FFFF;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0,255,255,0.4), 0 10px 30px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      z-index: 10000;
      overflow: hidden;
      animation: slideIn 0.3s ease;
    }

    #lumos-container.active {
      display: flex;
    }

    /* Cuando está en iframe, ocupar todo el espacio */
    body.in-iframe #lumos-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
      background: #000;
      max-height: none;
    }
    
    body.in-iframe {
      background: #000;
      overflow: hidden;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header RETRO con título CRT dominante */
    #lumos-header {
      background: #0A0A0A;
      padding: 20px;
      border-bottom: 2px solid #00FFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,255,255,0.15);
      position: relative;
    }

    /* TÍTULO ESTILO CRT - MEJORA PRINCIPAL */
    .lumos-title {
      font-family: "VT323", monospace;
      font-size: clamp(3.3rem, 6.6vw, 5.5rem);
      letter-spacing: 0.18em;
      color: #00FFFF;
      text-shadow:
        0 0 8px rgba(0,255,255,0.9),
        0 0 16px rgba(0,255,255,0.7),
        0 0 24px rgba(0,255,255,0.5);
      text-align: center;
      line-height: 1.1;
      animation: flicker 2s infinite alternate;
      margin-bottom: 10px;
      font-weight: normal;
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
      20%, 22%, 24%, 55% { opacity: 0.85; }
    }

    #lumos-header h2 {
      color: #00FFFF;
      font-size: 17px;
      font-weight: normal;
      text-shadow: 0 0 4px rgba(0,255,255,0.5);
      letter-spacing: 2px;
    }

    #lumos-header p {
      color: rgba(0,255,255,0.7);
      font-size: 14px;
      font-style: italic;
      text-shadow: 0 0 3px rgba(0,255,255,0.3);
      text-align: center;
    }

    #lumos-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #00FFFF;
      cursor: pointer;
      transition: all 0.2s;
      opacity: 0.8;
      padding: 4px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(0,255,255,0.2);
      pointer-events: auto;
      -webkit-user-select: none;
      user-select: none;
    }

    #lumos-close:hover {
      opacity: 1;
      filter: drop-shadow(0 0 8px rgba(0,255,255,0.8));
    }

    #lumos-close svg {
      width: 24px;
      height: 24px;
    }

    /* Chat messages */
    #lumos-messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #000;
    }

    #lumos-messages::-webkit-scrollbar {
      width: 6px;
    }

    #lumos-messages::-webkit-scrollbar-track {
      background: #0A0A0A;
    }

    #lumos-messages::-webkit-scrollbar-thumb {
      background: #00FFFF;
      border-radius: 3px;
      box-shadow: 0 0 4px rgba(0,255,255,0.5);
    }

    /* Mensajes - RETRO STYLE */
    .message {
      padding: 12px 14px;
      max-width: 90%;
      line-height: 1.6;
      border-radius: 8px;
      font-size: 18px;
      margin-bottom: 8px;
      color: #00FFFF;
      text-shadow: 0 0 2px rgba(0,255,255,0.3);
    }

    /* Móvil ≤ 767px - Aumentar tamaño +50% */
    @media (max-width: 767px) {
      .message, #lumos-input {
        font-size: 1.65rem;
      }
      
      .lumos-chip {
        font-size: 1.4rem;
      }
      
      .option-btn, .book-btn {
        font-size: 1.5rem;
      }
      
      .book-card h4 {
        font-size: 1.6rem;
      }
      
      .book-card p {
        font-size: 1.45rem;
      }
    }

    /* Tablet 768px – 1023px - Aumentar tamaño +50% */
    @media (min-width: 768px) and (max-width: 1023px) {
      .message, #lumos-input {
        font-size: 1.725rem;
      }
      
      .lumos-chip {
        font-size: 1.45rem;
      }
      
      .option-btn, .book-btn {
        font-size: 1.55rem;
      }
      
      .book-card h4 {
        font-size: 1.65rem;
      }
      
      .book-card p {
        font-size: 1.5rem;
      }
    }

    .message.lumos {
      background: rgba(0,255,255,0.07);
      border: 1px solid rgba(0,255,255,0.2);
      align-self: flex-start;
    }

    .message.user {
      background: rgba(0,255,255,0.18);
      border: 1px solid rgba(0,255,255,0.3);
      align-self: flex-end;
      text-align: right;
    }

    .message.alert {
      background: #0a0a0a;
      border: 1px solid #00FFFF;
      border-left: 3px solid #00FFFF;
      align-self: center;
      width: 95%;
      max-width: 300px;
      padding: 12px 14px;
      margin: 8px auto;
      font-size: 14px;
      color: #00FFFF;
    }

    /* CHIPS / ACCIONES RÁPIDAS */
    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      justify-content: center;
    }

    .lumos-chip {
      display: inline-block;
      background-color: #000;
      border: 1.5px solid #00FFFF;
      color: #00FFFF;
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 4px;
      font-family: "VT323", monospace;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      text-shadow: 0 0 2px rgba(0,255,255,0.3);
    }

    .lumos-chip:hover {
      background-color: rgba(0,255,255,0.1);
      box-shadow: 0 0 8px rgba(0,255,255,0.6);
      transform: translateY(-1px);
    }

    /* Opciones/Botones - SVG RETRO */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .option-btn {
      padding: 12px 18px;
      background: #0A0A0A;
      color: #00FFFF;
      border: 2px solid #00FFFF;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.15s ease;
      font-family: 'VT323', 'Courier New', monospace;
      text-shadow: 0 0 3px rgba(0,255,255,0.4);
      text-align: center;
    }

    .option-btn:hover {
      background: rgba(0,255,255,0.1);
      box-shadow: 0 0 8px rgba(0,255,255,0.6);
      transform: translateY(-1px);
    }

    /* Input container */
    #lumos-input-container {
      padding: 14px;
      background: #0A0A0A;
      border-top: 2px solid #00FFFF;
      display: flex;
      gap: 10px;
    }

    #lumos-input {
      flex: 1;
      padding: 12px 14px;
      background: #000;
      border: 2px solid #00FFFF;
      border-radius: 6px;
      color: #00FFFF;
      font-family: 'VT323', 'Courier New', monospace;
      font-size: 16px;
      text-shadow: 0 0 2px rgba(0,255,255,0.3);
    }

    #lumos-input:focus {
      outline: none;
      border-color: #00FFFF;
      box-shadow: 0 0 8px rgba(0,255,255,0.4);
    }

    #lumos-input::placeholder {
      color: rgba(0,255,255,0.4);
    }

    #lumos-send {
      padding: 12px 18px;
      background: #0A0A0A;
      border: 2px solid #00FFFF;
      border-radius: 6px;
      color: #00FFFF;
      font-weight: normal;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 16px;
      font-family: 'VT323', 'Courier New', monospace;
      text-shadow: 0 0 3px rgba(0,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
    }

    #lumos-send svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }

    #lumos-send:hover {
      background: rgba(0,255,255,0.1);
      box-shadow: 0 0 8px rgba(0,255,255,0.6);
    }

    /* Book card - RETRO */
    .book-card {
      background: #0A0A0A;
      padding: 12px;
      border-radius: 6px;
      border: 2px solid #00FFFF;
      margin-top: 10px;
      box-shadow: 0 0 6px rgba(0,255,255,0.2);
    }

    .book-card.recommendation-card {
      background: linear-gradient(135deg, #0A0A0A 0%, rgba(0,255,255,0.05) 100%);
      border: 2px solid rgba(0,255,255,0.6);
      position: relative;
      padding-top: 35px;
    }

    .recommendation-number {
      position: absolute;
      top: 8px;
      left: 12px;
      color: #00FFFF;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 0 3px rgba(0,255,255,0.4);
    }

    .book-card h4 {
      color: #00FFFF;
      margin-bottom: 6px;
      font-size: 17px;
      text-shadow: 0 0 3px rgba(0,255,255,0.4);
    }

    .book-card p {
      color: rgba(0,255,255,0.8);
      font-size: 16px;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .book-card .author {
      color: rgba(0,255,255,0.6);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .book-card .saga-info {
      color: rgba(0,255,255,0.5);
      font-size: 13px;
      margin-bottom: 8px;
      font-style: italic;
    }

    .book-card .reason {
      background: rgba(0,255,255,0.08);
      padding: 8px;
      border-left: 2px solid #00FFFF;
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      margin: 8px 0;
      line-height: 1.4;
    }

    .book-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .book-btn {
      padding: 10px 16px;
      font-size: 16px;
      background: #0A0A0A;
      color: #00FFFF;
      border: 2px solid #00FFFF;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'VT323', 'Courier New', monospace;
      text-shadow: 0 0 2px rgba(0,255,255,0.3);
    }

    .book-btn:hover {
      background: rgba(0,255,255,0.1);
      box-shadow: 0 0 6px rgba(0,255,255,0.6);
    }

    /* Loading animation - RETRO */
    .loading {
      display: flex;
      gap: 6px;
      padding: 10px;
      justify-content: center;
    }

    .loading span {
      width: 6px;
      height: 6px;
      background: #00FFFF;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
      box-shadow: 0 0 4px rgba(0,255,255,0.6);
    }

    .loading span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .loading span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }

    /* ========================================
       RESPONSIVE - MOBILE FIRST
       ======================================== */
    
    /* MÓVIL (≤767px) - Chat app retro */
    @media (max-width: 767px) {
      #lumos-container {
        width: 100%;
        height: 90vh;
        bottom: 0;
        right: 0;
        left: 0;
        border-radius: 16px 16px 0 0;
        border-bottom: none;
      }
      
      body.in-iframe #lumos-container {
        border-radius: 0;
        height: 100%;
      }

      #lumos-trigger {
        width: 60px;
        height: 60px;
        bottom: 16px;
        right: 16px;
      }

      #lumos-header {
        padding: 14px 16px;
      }

      .lumos-title {
        font-size: clamp(2.2rem, 8.8vw, 3.3rem);
      }

      #lumos-header h2 {
        font-size: 16px;
      }

      #lumos-header p {
        font-size: 13px;
      }

      #lumos-close {
        top: 12px;
        right: 12px;
        width: 32px;
        height: 32px;
        padding: 6px;
      }

      #lumos-close svg {
        width: 20px;
        height: 20px;
      }

      #lumos-messages {
        padding: 14px;
        gap: 10px;
      }

      .message {
        font-size: 17px;
        padding: 12px 14px;
        line-height: 1.6;
      }

      .lumos-chip {
        font-size: 0.9rem;
        padding: 10px 14px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: rgba(0,255,255,0.2);
      }

      .option-btn {
        font-size: 16px;
        padding: 14px 16px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: rgba(0,255,255,0.2);
      }

      #lumos-input-container {
        padding: 12px;
      }

      #lumos-input {
        font-size: 16px;
        padding: 11px 13px;
      }

      #lumos-send {
        font-size: 16px;
        padding: 11px 18px;
      }

      .book-card h4 {
        font-size: 17px;
      }

      .book-card p {
        font-size: 16px;
      }

      .book-btn {
        font-size: 15px;
        padding: 10px 14px;
      }
    }
    
    /* TABLET (768px - 1023px) - Panel lateral equilibrado */
    @media (min-width: 768px) and (max-width: 1023px) {
      #lumos-container {
        width: 460px;
        height: 72vh;
        max-height: 700px;
        bottom: 20px;
        right: 20px;
        border-radius: 18px;
      }

      #lumos-trigger {
        width: 54px;
        height: 54px;
        bottom: 18px;
        right: 18px;
      }

      .lumos-title {
        font-size: clamp(2.75rem, 5.5vw, 4.4rem);
      }

      #lumos-header h2 {
        font-size: 18px;
      }

      #lumos-header p {
        font-size: 14px;
      }

      .message {
        font-size: 18px;
        line-height: 1.6;
      }

      .option-btn {
        font-size: 16px;
        padding: 12px 18px;
      }

      #lumos-input {
        font-size: 16px;
        padding: 12px 14px;
      }

      #lumos-send {
        font-size: 16px;
      }

      .book-card h4 {
        font-size: 18px;
      }

      .book-card p {
        font-size: 17px;
      }

      .book-btn {
        font-size: 16px;
      }
    }

    /* Accesibilidad - Reducir animaciones */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    /* SVG Icons - Reemplazo de emojis en color cyan */
    .svg-icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: middle;
      margin: 0 0.2em;
      fill: none;
      stroke: #00FFFF;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .svg-icon.filled {
      fill: #00FFFF;
      stroke: none;
    }

    /* ========================================
       TEMA STRANGER THINGS - OVERRIDES
       ======================================== */
    body[data-theme="stranger"] {
      background: var(--theme-bg-primary);
      color: var(--theme-text-primary);
    }

    body[data-theme="stranger"] #lumos-trigger {
      background: var(--theme-trigger-bg);
      border-color: var(--theme-trigger-border);
      color: var(--theme-trigger-color);
      box-shadow: var(--theme-box-shadow-trigger);
    }

    body[data-theme="stranger"] #lumos-trigger:hover {
      box-shadow: var(--theme-box-shadow-trigger-hover);
    }

    /* Contenedor del bot con fondo semitransparente para contraste y borde degradado */
    body[data-theme="stranger"] #lumos-container {
      background: rgba(8, 4, 13, 0.95);
      border: 3px solid transparent;
      background-image: 
        linear-gradient(rgba(8, 4, 13, 0.95), rgba(8, 4, 13, 0.95)),
        linear-gradient(135deg, #ff305b 0%, #ff305b 50%, #7dd3ff 50%, #7dd3ff 100%);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 0 20px rgba(255, 48, 91, 0.4), 0 0 40px rgba(125, 211, 255, 0.2);
    }

    body[data-theme="stranger"] #lumos-header {
      background: var(--theme-bg-header);
      border-bottom-color: var(--theme-border-primary);
      box-shadow: var(--theme-box-shadow-header);
    }

    body[data-theme="stranger"] .lumos-title {
      color: var(--theme-text-primary);
      text-shadow: var(--theme-text-shadow-primary);
    }

    body[data-theme="stranger"] #lumos-header h2,
    body[data-theme="stranger"] #lumos-header p {
      color: var(--theme-text-primary);
      text-shadow: var(--theme-text-shadow-secondary);
    }

    body[data-theme="stranger"] #lumos-close {
      color: var(--theme-close-color);
    }

    body[data-theme="stranger"] #lumos-close:hover {
      filter: var(--theme-drop-shadow-close-hover);
    }

    body[data-theme="stranger"] #lumos-messages {
      background: var(--theme-bg-primary);
    }

    body[data-theme="stranger"] #lumos-messages::-webkit-scrollbar-track {
      background: var(--theme-scrollbar-track-bg);
    }

    body[data-theme="stranger"] #lumos-messages::-webkit-scrollbar-thumb {
      background: var(--theme-scrollbar-thumb-bg);
      box-shadow: var(--theme-scrollbar-thumb-shadow);
    }

    body[data-theme="stranger"] .message {
      color: var(--theme-text-primary);
      text-shadow: var(--theme-text-shadow-subtle);
    }

    body[data-theme="stranger"] .message.lumos {
      background: var(--theme-msg-bot-bg);
      border-color: var(--theme-msg-bot-border);
      color: var(--theme-msg-bot-color);
    }

    body[data-theme="stranger"] .message.user {
      background: var(--theme-msg-user-bg);
      border-color: var(--theme-msg-user-border);
      color: var(--theme-msg-user-color);
    }

    body[data-theme="stranger"] .message.alert {
      background: var(--theme-msg-alert-bg);
      border-color: var(--theme-msg-alert-border);
      border-left-color: var(--theme-msg-alert-border-left);
      color: var(--theme-msg-alert-color);
    }

    /* Chips con degradado rojo→azul */
    body[data-theme="stranger"] .lumos-chip {
      background: linear-gradient(90deg, rgba(255, 48, 91, 0.1) 0%, rgba(125, 211, 255, 0.1) 100%);
      border: 2px solid transparent;
      background-image: 
        linear-gradient(var(--theme-chip-bg), var(--theme-chip-bg)),
        linear-gradient(90deg, #ff305b 0%, #7dd3ff 100%);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      color: transparent;
      background-clip: text, padding-box, border-box;
      -webkit-background-clip: text, padding-box, border-box;
      -webkit-text-fill-color: transparent;
      background-image: linear-gradient(90deg, #ff305b 0%, #7dd3ff 100%);
    }

    body[data-theme="stranger"] .lumos-chip:hover {
      box-shadow: 0 0 12px rgba(255, 48, 91, 0.5), 0 0 8px rgba(125, 211, 255, 0.3);
    }

    /* Botones de opción con degradado rojo→azul */
    body[data-theme="stranger"] .option-btn {
      background: linear-gradient(90deg, rgba(255, 48, 91, 0.1) 0%, rgba(125, 211, 255, 0.1) 100%);
      border: 2px solid transparent;
      background-image: 
        linear-gradient(var(--theme-option-btn-bg), var(--theme-option-btn-bg)),
        linear-gradient(90deg, #ff305b 0%, #7dd3ff 100%);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      color: #ff305b;
      text-shadow: var(--theme-text-shadow-tertiary);
    }

    body[data-theme="stranger"] .option-btn:hover {
      background: var(--theme-hover-bg);
      box-shadow: var(--theme-box-shadow-btn-hover);
    }

    body[data-theme="stranger"] #lumos-input-container {
      background: var(--theme-bg-header);
      border-top-color: var(--theme-border-primary);
    }

  <!-- === END THEME SYSTEM === -->
  <script>
    (function() {
      const applyTheme = (themeName) => {
        const nextTheme = themeName || 'stranger';
        document.documentElement.setAttribute('data-theme', nextTheme);
        if (document.body) {
          document.body.setAttribute('data-theme', nextTheme);
        } else {
          document.addEventListener('DOMContentLoaded', () => document.body.setAttribute('data-theme', nextTheme), { once: true });
        }
      };

      const savedTheme = localStorage.getItem('theme') || 'stranger';
      applyTheme(savedTheme);

      window.addEventListener('storage', (event) => {
        if (event.key === 'theme' && event.newValue) {
          applyTheme(event.newValue);
        }
      });

      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'THEME_CHANGED' && event.data.theme) {
          applyTheme(event.data.theme);
        }
      });
    })();
  </script>

  <script>
    /* ========================================
       SISTEMA DE TEMAS - PREPARADO (APAGADO)
       ======================================== */
    
    /**
     * 🚫 IMPORTANTE: Este código está PREPARADO pero NO SE EJECUTA
     * 
     * Se activa manualmente cuando el sistema de temas esté listo.
     * Por ahora, es solo un "interruptor apagado" que no afecta nada.
     * 
     * Paso actual: PASO 2 - Preparar el interruptor (APAGADO)
     * Estado: ✅ Preparado | 🚫 NO ejecutado | 🔴 NO aplicado
     */
    
    // FUNCIÓN PREPARADA (no se ejecuta automáticamente)
    function initThemeSystem() {
      // Cargar tema guardado o usar default
      const savedTheme = localStorage.getItem('azkaban-theme') || 'default';
      
      // Aplicar el tema al elemento root
      document.documentElement.dataset.theme = savedTheme;
      
      console.log(`🎨 Sistema de temas inicializado: ${savedTheme}`);
    }
    
    // FUNCIÓN PREPARADA para cambiar temas
    function setTheme(themeName) {
      // Validar que el tema existe
      const validThemes = ['default', 'stranger-things'];
      
      if (!validThemes.includes(themeName)) {
        console.warn(`⚠️ Tema "${themeName}" no válido. Usando default.`);
        themeName = 'default';
      }
      
      // Aplicar tema
      document.documentElement.dataset.theme = themeName;
      
      // Guardar preferencia
      localStorage.setItem('azkaban-theme', themeName);
      
      console.log(`🎨 Tema cambiado a: ${themeName}`);
    }
    
    /**
     * ⚠️ NO DESCOMENTAR HASTA PASO 3
     * 
     * Para activar el sistema de temas:
     * 1. Importar el CSS de temas en el <head>
     * 2. Descomentar la línea siguiente
     * 3. Verificar que todo funciona
     */
    
    // ❌ NO EJECUTAR TODAVÍA
    // document.addEventListener('DOMContentLoaded', initThemeSystem);
    
    /* ======================================== */
    
    // Función auxiliar para generar iconos SVG en lugar de emojis
    function icon(name, className = 'svg-icon') {
      return `<svg class="${className}"><use href="#icon-${name}"></use></svg>`;
    }

    // Escapar HTML para evitar inyecciones en textos dinámicos
    function escapeHtml(str = '') {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatAiReplyText(text = '') {
      if (!text) {
        return 'Las sombras guardan silencio. Intenta reformular tu petición.';
      }
      const safe = escapeHtml(text);
      return safe
        .replace(/\n{2,}/g, '<br><br>')
        .replace(/\n/g, '<br>');
    }

    // Estado del chat
    const state = {
      currentFlow: 'welcome',
      waitingFor: null,
      requestData: {},
      favoriteBooks: [],
      searchQuery: '',
      notificationData: {},
      pendingSpoiler: null
    };

    // Toggle LUMOS visibility
    function toggleLumos() {
      const container = document.getElementById('lumos-container');
      const trigger = document.getElementById('lumos-trigger');
      
      container.classList.toggle('active');
      trigger.classList.toggle('active');

      // Mostrar mensaje de bienvenida al abrir por primera vez
      if (container.classList.contains('active') && 
          document.getElementById('lumos-messages').children.length === 0) {
        showWelcomeMessage();
      }
    }

    // Mensaje de bienvenida con mensaje dinámico
    function showWelcomeMessage() {
      // Mensajes alternativos si aiService no está cargado
      const fallbackMessages = [
        "Los libros permanecen encadenados en estas sombras... ¿Qué buscas, mortal?",
        "Soy LUMOS, guardián de Azkaban Reads. Las obras prohibidas reposan aquí. ¿Qué deseas?",
        "Entre estos muros dormitan secretos encuadernados. ¿Qué te trae ante mí?"
      ];
      
      let initialMessage;
      if (window.AzkabanAI && typeof window.AzkabanAI.getRandomInitialMessage === 'function') {
        initialMessage = window.AzkabanAI.getRandomInitialMessage();
      } else {
        initialMessage = fallbackMessages[Math.floor(Math.random() * fallbackMessages.length)];
      }
      
      addLumosMessage(initialMessage, true);

      setTimeout(() => {
        addQuickActionChips();
      }, 500);
    }

    // Añadir chips de acciones rápidas
    function addQuickActionChips() {
      const messagesContainer = document.getElementById('lumos-messages');
      const chipsContainer = document.createElement('div');
      chipsContainer.className = 'chips-container';
      
      const chips = [
        { text: 'Recomiéndame algo', action: 'recommend' },
        { text: 'Buscar libro', action: 'search' },
        { text: 'Novedades', action: 'notify' },
        { text: 'Solicitar libro', action: 'request' },
        { text: 'Test lector', action: 'test' },
        { text: 'Spoilers', action: 'spoiler_prompt' }
      ];
      
      chips.forEach(chip => {
        const chipEl = document.createElement('button');
        chipEl.className = 'lumos-chip';
        chipEl.textContent = chip.text;
        chipEl.onclick = () => handleChipClick(chip.action);
        chipsContainer.appendChild(chipEl);
      });
      
      messagesContainer.appendChild(chipsContainer);
      scrollToBottom();
    }

    // Manejar clic en chips
    function handleChipClick(action) {
      handleOptionClick(action);
    }

    // Mostrar opciones principales
    function showMainOptions() {
      const options = [
          { text: `${icon('search')} Buscar libro`, action: 'search', allowHTML: true },
          { text: `${icon('heart')} Recomiéndame algo`, action: 'recommend', allowHTML: true },
          { text: `${icon('flask')} Test lector`, action: 'test', allowHTML: true },
          { text: `${icon('bell')} Avisarme de novedades`, action: 'notify', allowHTML: true },
          { text: `${icon('mail')} Solicitar un libro`, action: 'request', allowHTML: true },
          { text: `${icon('warning')} Spoilers`, action: 'spoiler_prompt', allowHTML: true },
          { text: `${icon('help')} Ayuda`, action: 'help', allowHTML: true }
      ];

      addOptionsToChat(options);
    }

    // Añadir mensaje de LUMOS
    function addLumosMessage(text, isFirst = false) {
      const messagesContainer = document.getElementById('lumos-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message lumos';
      messageDiv.innerHTML = text;
      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
    }

    // Agregar mensaje de alerta (spam warning, etc)
    function addAlertMessage(text) {
      const messagesContainer = document.getElementById('lumos-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message alert';
      messageDiv.innerHTML = text;
      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
    }

    // Añadir mensaje del usuario (permite HTML controlado para iconos)
    function addUserMessage(text, allowHTML = false) {
      const messagesContainer = document.getElementById('lumos-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message user';

      const isHtml = allowHTML || /<svg|<strong|<br\/>|<br>/i.test(text);
      if (isHtml) {
        messageDiv.innerHTML = text;
      } else {
        messageDiv.textContent = text;
      }

      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
    }

    // Añadir opciones como botones (soporta HTML seguro para iconos)
    function addOptionsToChat(options) {
      const messagesContainer = document.getElementById('lumos-messages');
      const optionsContainer = document.createElement('div');
      optionsContainer.className = 'options-container';

      options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';

        const text = option.text || '';
        const isHtml = option.allowHTML || /<svg|<strong|<br\/>|<br>/i.test(text);
        if (isHtml) {
          btn.innerHTML = text;
        } else {
          btn.textContent = text;
        }

        btn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          if (window.handleOptionClick) {
            window.handleOptionClick(option.action, option.data);
          }
        });
        optionsContainer.appendChild(btn);
      });

      messagesContainer.appendChild(optionsContainer);
      scrollToBottom();
    }

    // Manejar clic en opciones
    window.handleOptionClick = async function(action, data) {
      switch (action) {
        case 'search':
          addUserMessage(`${icon('search')} Buscar libro`, true);
          addLumosMessage('Dime el título, autor o saga que buscas entre los muros...');
          state.currentFlow = 'search';
          state.waitingFor = 'search_query';
          break;

        case 'recommend':
          addUserMessage(`${icon('heart')} Recomiéndame algo`, true);
          showRecommendOptions();
          break;

        case 'recommend_type_selected':
          addUserMessage(`${data.type === 'saga' ? '📖 Una saga envolvente' : data.type === 'standalone' ? '📖 Algo para terminar rápido' : '🎲 Sorpréndeme'}`, true);
          await handleRecommendationTypeSelected(data);
          break;

        case 'test':
          addUserMessage(`${icon('flask')} Test lector`, true);
          startReaderTest();
          break;

        case 'notify':
          addUserMessage(`${icon('bell')} Avisarme de novedades`, true);
          showNotifyOptions();
          break;

        case 'notify_subscribe':
          addUserMessage(`${icon('book')} Todos los libros nuevos`, true);
          await subscribeToNotifications(data.type);
          break;

        case 'notify_author':
          addUserMessage(`${icon('user')} Libros de un autor específico`, true);
          addLumosMessage('¿De qué autor quieres recibir notificaciones?');
          state.waitingFor = 'notify_author_name';
          break;

        case 'notify_saga':
          addUserMessage(`${icon('book')} Libros de una saga específica`, true);
          addLumosMessage('¿De qué saga quieres recibir notificaciones?');
          state.waitingFor = 'notify_saga_name';
          break;

        case 'request':
          addUserMessage(`${icon('mail')} Solicitar un libro`, true);
          startBookRequest();
          break;

        case 'spoiler_prompt':
          addUserMessage(`${icon('warning')} Quiero spoilers`, true);
          addLumosMessage('¿De qué libro deseas que revele los secretos? Escribe el título:');
          state.currentFlow = 'spoiler';
          state.waitingFor = 'spoiler_book';
          break;

        case 'spoiler_confirm':
          addUserMessage(`${icon('check')} Sí, quiero el spoiler`, true);
          await revealSpoiler(data.bookTitle, data.isQuestion || false);
          break;

        case 'spoiler_selected':
          addUserMessage('He elegido un final...');
          addLumosMessage('Interesante elección. Pero recuerda: en Azkaban, la verdad y la mentira danzan juntas en las sombras. Solo el tiempo y la lectura revelarán si has elegido sabiamente.');
          // No revelar si es verdadero o falso
          break;

        case 'cancel':
          addUserMessage(`${icon('close')} Cancelar`, true);
          addLumosMessage('Sabio. Algunos secretos deben preservarse. ¿Qué más deseas?');
          showMainOptions();
          state.waitingFor = null;
          state.pendingSpoiler = null;
          break;

        case 'help':
          addUserMessage(`${icon('help')} Ayuda`, true);
          showHelp();
          break;

        case 'search_execute':
          await executeSearch(state.searchQuery);
          break;

        case 'recommend_execute':
          await executeRecommendation(data);
          break;

        case 'download_book':
          window.open(`/descargar/${data.id}`, '_blank');
          addLumosMessage('El libro ha sido liberado... temporalmente.');
          showContinueOptions();
          break;

        case 'view_similar':
          await showSimilarBooks(data.id);
          break;

        case 'request_book':
          addLumosMessage('Registraré tu solicitud. Dime el título del libro que buscas.');
          state.currentFlow = 'request';
          state.waitingFor = 'request_title';
          break;

        case 'recommend_similar':
          addLumosMessage('Buscando entre las sombras...');
          showRecommendOptions();
          break;

        case 'back':
          addUserMessage('Volver al inicio');
          addLumosMessage('¿Qué más necesitas de mí?');
          showMainOptions();
          break;

        case 'close':
          addUserMessage('Cerrar');
          addLumosMessage('Estaré aquí... en la oscuridad, cuando me necesites.');
          setTimeout(() => {
            if (window.self !== window.top) {
              closeLumos();
            } else {
              toggleLumos();
            }
          }, 1500);
          break;

        default:
          console.log('Acción no manejada:', action);
      }
    };

    // Ejecutar búsqueda
    async function executeSearch(query) {
      showLoading();
      
      try {

    // Detectar la intención del usuario (espejo de aiService.js)
    function detectIntentClient(message) {
      const lowerMessage = message.toLowerCase().trim();
      
      const patterns = {
        spoiler_character: /spoiler.*(?:de|del|sobre|qué pasa con|qué le pasa a|personaje|muerte de)\s+(\w+)|qué le pasa a\s+(\w+)|muere\s+(\w+)|final.*(?:de|de la)\s+(\w+)/i,
        spoiler_book: /spoiler.*(?:de|del|sobre|del libro|del libro titulado)\s+(.+?)(?:\?|$|por favor)|spoiler.*libro|final.*(?:del|de)\s+(.+?)(?:\?|$)/i,
        spoiler: /spoiler|spoilea|revelar|final|termina|acabar|qué pasa|cuenta.*final/i,
        request: /solicitar|solicito|pedir|quiero.*solicitar|quiero.*pedir|no.*encuentr|no.*tenéis|no.*está|agregar|añadir|quiero.*este.*libro|necesito.*este|ese.*libro.*no/i,
        search: /busco|buscar|encontrar|quiero.*libro|dame.*libro|tienes.*libro|búsqueda|hay.*libro|tenéis.*libro|existe/i,
        recommend: /recomien|recomienda|suger|qué.*leer|dame.*algo|sorpren|inspira|qué me|dame un/i,
        test: /test|quiz|cuestionario|descubr.*lector|qué.*tipo.*lector|soy.*lector/i,
        notify: /avisa|avisen|notifica|notifique|notificarme|avis(?:a|ar|o)|alerta|alertarme|alertas|novedades|nuevos.*libros|libros.*nuevos|cuando.*suba|cuando.*suban|cuando.*agreguen|cuando.*agregue|suscri|avisame de|avísame de/i,
        help: /ayuda|cómo.*funciona|qué.*puedes|qué puedo|comandos|instruccion|help|manual|guía/i,
        greeting: /hola|buenos|buenas|saludos|hey|qué tal|holi|buenos días|buenas noches|buenas tardes|¿qué hay|cómo estás|cómo andas/i,
        thanks: /gracias|perfecto|genial|excelente|ok|vale|muy bien|chevere|merci/i
      };
      
      if (patterns.spoiler_character.test(lowerMessage)) return 'spoiler_character';
      if (patterns.spoiler_book.test(lowerMessage)) return 'spoiler_book';
      if (patterns.request.test(lowerMessage)) return 'request';
      
      for (const [intent, pattern] of Object.entries(patterns)) {
        if (intent !== 'spoiler_character' && intent !== 'spoiler_book' && intent !== 'request' && pattern.test(lowerMessage)) {
          return intent;
        }
      }
      
      if (/libro|autor|saga|novela|serie|título/i.test(lowerMessage)) {
        return 'search';
      }
      
      return 'unknown';
    }

    async function askLumosAI(message) {
      showLoading();
      
      // Detectar intención del usuario
      const intent = detectIntentClient(message);
      
      // Enrutar según intención
      switch(intent) {
        case 'request':
          removeLoading();
          addLumosMessage('Registraré tu solicitud. Dime el título del libro que buscas.');
          state.currentFlow = 'request';
          state.waitingFor = 'request_title';
          return;
          
        case 'search':
          removeLoading();
          await executeSearch(message);
          return;
          
        case 'spoiler':
        case 'spoiler_book':
          removeLoading();
          addLumosMessage('¿De qué libro deseas que revele los secretos? Escribe el título:');
          state.currentFlow = 'spoiler';
          state.waitingFor = 'spoiler_book';
          return;
          
        case 'spoiler_character':
          removeLoading();
          addLumosMessage('¿En qué libro ocurre esta historia?');
          state.currentFlow = 'spoiler';
          state.waitingFor = 'spoiler_book';
          return;
          
        case 'recommend':
          removeLoading();
          showRecommendOptions();
          return;
          
        case 'notify':
          removeLoading();
          showNotifyOptions();
          return;
          
        case 'test':
          removeLoading();
          startReaderTest();
          return;
          
        case 'help':
          removeLoading();
          showHelp();
          return;
      }

      // Por defecto: ir a /lumos-chat para conversación general
      try {
        const response = await fetch('/lumos-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        if (!response.ok) {
          throw new Error(`status_${response.status}`);
        }

        const data = await response.json();
        removeLoading();

        if (data.reply) {
          addLumosMessage(formatAiReplyText(data.reply));
        } else {
          addLumosMessage('LUMOS no ha encontrado nada con esa descripción, pero puedo intentar otra búsqueda si lo deseas.');
        }

        if (Array.isArray(data.books) && data.books.length) {
          data.books.forEach(book => addBookCard(book));
        }
      } catch (error) {
        console.error('Error conversando con LUMOS AI:', error);
        removeLoading();
        addLumosMessage('No puedo conectar con el motor de LUMOS AI ahora mismo. Intenta de nuevo más tarde.');
      }
    }

    // Revelar spoiler (solo después de confirmación)
    async function revealSpoiler(bookTitle, isQuestion = false) {
      showLoading();
      
      try {
        // Preparar la pregunta según si es una pregunta de personaje o un título de libro
        let question;
        if (isQuestion) {
          // Es una pregunta sobre un personaje: mandar la pregunta directamente
          question = bookTitle; // En este caso, "bookTitle" es realmente la pregunta
        } else {
          // Es un título de libro: mandar con contexto de spoiler
          question = `Spoiler de ${bookTitle}`;
        }
        
        // Llamar al endpoint específico de spoilers
        const response = await fetch('/api/spoilers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            title: bookTitle,
            question: question
          })
        });
        const spoilerData = await response.json();

        removeLoading();

        if (spoilerData.success && spoilerData.spoiler) {
          // El spoiler fue encontrado
          addLumosMessage(`${icon('warning')} <strong>ADVERTENCIA: SPOILERS POTENCIALES</strong>`);
          addLumosMessage(`${icon('spiral')} Las sombras susurran secretos prohibidos... Aquí está lo que he desenterrado:`);
          addLumosMessage(spoilerData.spoiler);
          addLumosMessage('Recuerda: en Azkaban, estos secretos nunca pueden ser olvidados una vez revelados.');
          
          showContinueOptions();
        } else {
          // El libro NO existe o no hay spoiler disponible
          addLumosMessage(`${icon('spiral')} Susurro desde la penumbra: Los secretos sobre «${escapeHtml(bookTitle)}» no anidan entre los volúmenes que custodio.`);
          addLumosMessage('Intenta con otro título o pregunta...');
          showMainOptions();
        }
        
      } catch (error) {
        removeLoading();
        console.error('Error al revelar spoiler:', error);
        
        addLumosMessage(`${icon('spiral')} Los muros de Azkaban se interponen... No he podido acceder a los secretos de "${escapeHtml(bookTitle)}" en este momento. Las sombras guardan sus misterios celosamente.`);
        showMainOptions();
      }
      
      state.pendingSpoiler = null;
    }

    // Enviar mensaje del usuario
    async function sendMessage() {
      const input = document.getElementById('lumos-input');
      const message = input.value.trim();
      
      if (!message) return;
      
      addUserMessage(message);
      input.value = '';

      await processUserMessage(message);

    // Procesar mensaje del usuario según el flujo actual
    async function processUserMessage(message) {
      switch (state.waitingFor) {
        case 'search_query':
          state.searchQuery = message;
          await executeSearch(message);
          state.waitingFor = null;
          break;

        case 'request_title':
          state.requestData.title = message;
          addLumosMessage('¿Quién es el autor?');
          state.waitingFor = 'request_author';
          break;

        case 'request_author':
          state.requestData.author = message;
          addLumosMessage('¿Cuál es tu correo electrónico para notificarte?');
          state.waitingFor = 'request_email';
          break;

        case 'request_email':
          state.requestData.email = message;
          await submitBookRequest();
          state.waitingFor = null;
          break;

        case 'test_book_1':
        case 'test_book_2':
        case 'test_book_3':
          await handleTestBookInput(message);
          break;

        case 'notify_author_name':
          state.notificationData = { type: 'author', filters: { author: message } };
          addLumosMessage('¿Cuál es tu correo electrónico para enviarte las notificaciones?');
          state.waitingFor = 'notify_email';
          break;

        case 'notify_saga_name':
          state.notificationData = { type: 'saga', filters: { saga: message } };
          addLumosMessage('¿Cuál es tu correo electrónico para enviarte las notificaciones?');
          state.waitingFor = 'notify_email';
          break;

        case 'notify_email':
          await finalizeNotificationSubscription(message);
          state.waitingFor = null;
          break;

        case 'recommend_preferences':
          addUserMessage(message);
          await executeRecommendation(message);
          state.waitingFor = null;
          break;

        case 'spoiler_book':
          state.pendingSpoiler = message;
          // Detectar si es una pregunta sobre un personaje o un título de libro
          const isCharacterQuestion = /\b(ama|muere|muieren|quien|qué|donde|dónde|cómo|como|es|vuelve|se convierte|traicion|traidor|enemigo|rival|relacion|romance|hijo|hija|padre|madre|hermano|hermana|amigo)\b/i.test(message);
          
          let confirmMessage;
          if (isCharacterQuestion) {
            confirmMessage = `⚠️ <strong>ADVERTENCIA:</strong> Una pregunta peligrosa. ¿Confirmas que deseas que revele sobre <strong>${message}</strong>? Una vez revelado, el hechizo no puede deshacerse.`;
          } else {
            confirmMessage = `⚠️ <strong>ADVERTENCIA:</strong> Lo que me pides no tiene marcha atrás. ¿Confirmas que deseas un spoiler de <strong>${message}</strong>? Una vez revelado, el hechizo no puede deshacerse.`;
          }
          
          addLumosMessage(confirmMessage);
          const options = [
            { text: '✓ Sí, quiero el spoiler', action: 'spoiler_confirm', data: { bookTitle: message, isQuestion: isCharacterQuestion } },
            { text: '✗ No, mejor no', action: 'cancel' }
          ];
          addOptionsToChat(options);
          state.waitingFor = null;
          break;

        default:
          await askLumosAI(message);
      }
    }

    // Mostrar loading
    function showLoading() {
      const messagesContainer = document.getElementById('lumos-messages');
      const loading = document.createElement('div');
      loading.className = 'loading';
      loading.id = 'loading-indicator';
      loading.innerHTML = '<span></span><span></span><span></span>';
      messagesContainer.appendChild(loading);
      scrollToBottom();
    }

    // Remover loading
    function removeLoading() {
      const loading = document.getElementById('loading-indicator');
      if (loading) loading.remove();
    }

    // Scroll automático al final
    function scrollToBottom() {
      const messagesContainer = document.getElementById('lumos-messages');
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Manejar Enter en el input
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    // Auto-iniciar cuando se carga en iframe
    if (window.self !== window.top) {
      // Está en iframe
      document.addEventListener('DOMContentLoaded', function() {
        console.log('LUMOS: Cargado en iframe, iniciando...');
        // Agregar clase al body
        document.body.classList.add('in-iframe');
        
        // Detectar si es móvil - usar múltiples métodos
        let isMobile = false;
        
        // Método 1: User agent
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          isMobile = true;
        }
        
        // Método 2: Ancho de la ventana padre
        try {
          if (window.parent.innerWidth <= 768) {
            isMobile = true;
          }
        } catch(e) {
          // Si no puede acceder al padre, usar window.screen
          if (window.screen.width <= 768) {
            isMobile = true;
          }
        }
        
        // Método 3: Touch capability
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
          isMobile = true;
        }
        
        if (isMobile) {
          document.body.classList.add('mobile-device');
          console.log('LUMOS: Dispositivo móvil detectado - ancho:', window.parent.innerWidth || window.screen.width);
        }
        
        // Ocultar el botón trigger
        const trigger = document.getElementById('lumos-trigger');
        if (trigger) {
          trigger.style.display = 'none';
          console.log('LUMOS: Trigger ocultado');
        }
        // Mostrar el contenedor del chat
        const container = document.getElementById('lumos-container');
        if (container) {
          container.classList.add('active');
          console.log('LUMOS: Container activado');
        }
        // Esperar un momento para que el DOM esté completamente listo
        setTimeout(function() {
          console.log('LUMOS: Ejecutando showWelcomeMessage()');
          showWelcomeMessage();
        }, 100);
      });
    }

    // Enviar mensaje al padre para cerrar
    function closeLumos() {
      console.log('LUMOS: closeLumos() llamado');
      // Si estamos en iframe, notificar al padre
      if (window.self !== window.top) {
        console.log('LUMOS: En iframe, enviando mensaje al padre');
        window.parent.postMessage('lumos-close', '*');
      } else {
        console.log('LUMOS: No en iframe, cerrando contenedor');
        // Si no estamos en iframe, simplemente cerrar el contenedor
        const container = document.getElementById('lumos-container');
        if (container) {
          container.classList.remove('active');
        }
      }
    }

    // Actualizar el botón de cerrar para funcionar en iframe y standalone
    document.addEventListener('DOMContentLoaded', function() {
      const closeButton = document.getElementById('lumos-close');
      if (closeButton) {
        console.log('LUMOS: Botón de cerrar encontrado, añadiendo eventos');
        
        // Remover onclick inline si existe
        closeButton.onclick = null;
        
        // Función handler unificada
        const handleClose = function(e) {
          console.log('LUMOS: Evento de cierre disparado -', e.type);
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          closeLumos();
          return false;
        };
        
        // Múltiples eventos para máxima compatibilidad
        closeButton.addEventListener('click', handleClose, false);
        closeButton.addEventListener('touchstart', handleClose, { passive: false });
        closeButton.addEventListener('pointerdown', handleClose, false);
        
        // Evitar comportamiento por defecto en todos los casos
        closeButton.addEventListener('touchend', function(e) {
          e.preventDefault();
        }, { passive: false });
        
        console.log('LUMOS: Eventos de cierre vinculados correctamente');
      } else {
        console.error('LUMOS: Botón de cerrar NO encontrado');
      }
    });
  </script>

</body>
